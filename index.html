<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon says Game</title>
    <link rel="stylesheet" href="simon.css">
</head>

<body>
    <h1>Simon Says Game </h1>
    <h2>(Press any Keyboard key to start the game)</h2>
    <div class="container">
        <div class="box green" id="green" type="button"></div>
        <div class="box red" id="red" type="button"></div>
        <div class="box yellow" id="yellow" type="button"></div>
        <div class="box blue" id="blue" type="button"></div>
    </div>






    <script src="simon.js"></script>
</body>

</html>
